name: Feature request
description: Suggest something this repository should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The job you want to get done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Code or an example call helps.
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
